[project]
name = "infrastructure-boilerplate"
version = "0.1.0"
dependencies = [
    "aiokafka>=0.12.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "fastapi[standard]>=0.115.0",
    "greenlet>=3.5.6",
    "httpx>=0.27.0",
    "pydantic-settings>=2.7.0",
    "redis>=5.2.0",
    "sqladmin>=0.20.0",
    "sqlalchemy>=2.0.36",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
]
requires-python = ">=3.10"
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "locust>=2.46.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.setuptools.packages.find]
include = ["core*", "domain*", "application*", "infrastructure*", "presentation*"]
